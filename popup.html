<!DOCTYPE html>
<html>
<head>
<style>
  :root {
    --bg: #fff; --fg: #222; --track-off: #ccc; --track-on: #4a90d9; --knob: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e; --fg: #e0e0e0; --track-off: #555; --track-on: #4a90d9; --knob: #fff;
    }
  }
  body {
    width: 140px; padding: 10px;
    background: var(--bg); color: var(--fg);
    font-family: sans-serif; font-size: 13px;
    display: flex; flex-direction: column; align-items: center;
  }
  .row {
    display: flex; align-items: center; gap: 8px;
  }
  .label { font-size: 13px; }
  .toggle {
    position: relative; width: 40px; height: 22px;
    background: var(--track-off); border-radius: 11px;
    cursor: pointer; transition: background 0.2s;
    flex-shrink: 0;
  }
  .toggle.on { background: var(--track-on); }
  .toggle::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--knob); transition: transform 0.2s;
  }
  .toggle.on::after { transform: translateX(18px); }
  #manage {
    font-size: 11px; color: #888; cursor: pointer;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="row">
    <span class="label">Dark</span>
    <div id="toggle" class="toggle"></div>
  </div>
  <div id="manage">Manage</div>
  <script src="popup.js"></script>
</body>
</html>
