<!DOCTYPE html>
<html>
<head>
<style>
  :root {
    --bg: #fff; --fg: #222; --card: #f5f5f5; --danger: #e74c3c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e; --fg: #e0e0e0; --card: #2a2a2a; --danger: #e74c3c;
    }
  }
  body {
    max-width: 480px; margin: 24px auto; padding: 0 16px;
    background: var(--bg); color: var(--fg);
    font-family: sans-serif; font-size: 14px;
  }
  h1 { font-size: 18px; margin-bottom: 16px; }
  .site {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); padding: 10px 12px; border-radius: 6px;
    margin-bottom: 8px;
  }
  .site span { word-break: break-all; }
  .site button {
    background: none; border: none; color: var(--danger);
    cursor: pointer; font-size: 12px; padding: 4px 8px;
    border-radius: 4px; white-space: nowrap;
  }
  .site button:hover { background: rgba(231,76,60,0.1); }
  .empty { color: #888; font-style: italic; }
  .clear-all {
    margin-top: 16px; background: none; border: 1px solid var(--danger);
    color: var(--danger); padding: 6px 12px; border-radius: 4px; cursor: pointer;
  }
  .clear-all:hover { background: rgba(231,76,60,0.1); }
</style>
</head>
<body>
  <h1>Saved Dark Mode Sites</h1>
  <div id="list"></div>
  <button id="clearAll" class="clear-all" style="display:none">Clear All</button>
  <script src="options.js"></script>
</body>
</html>
