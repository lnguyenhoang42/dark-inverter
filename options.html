<!DOCTYPE html>
<html>
<head>
<style>
  :root { --bg:#fff; --fg:#222; --card:#f5f5f5; --danger:#e74c3c; --track-off:#ccc; --track-on:#4a90d9; --knob:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1e1e1e; --fg:#e0e0e0; --card:#2a2a2a; } }
  body { max-width:520px; margin:24px auto; padding:0 16px; background:var(--bg); color:var(--fg); font-family:sans-serif; font-size:14px; }
  h1 { font-size:18px; margin-bottom:16px; }
  h2 { font-size:15px; margin:24px 0 12px; }
  .site, .override { display:flex; align-items:center; justify-content:space-between; background:var(--card); padding:10px 12px; border-radius:6px; margin-bottom:8px; gap:8px; }
  .site span, .override span { word-break:break-all; flex:1; }
  .site button { background:none; border:none; color:var(--danger); cursor:pointer; font-size:12px; padding:4px 8px; border-radius:4px; white-space:nowrap; }
  .site button:hover { background:rgba(231,76,60,0.1); }
  .empty { color:#888; font-style:italic; }
  .clear-all { margin-top:16px; background:none; border:1px solid var(--danger); color:var(--danger); padding:6px 12px; border-radius:4px; cursor:pointer; }
  .toggle { position:relative; width:36px; height:20px; background:var(--track-off); border-radius:10px; cursor:pointer; transition:background 0.2s; flex-shrink:0; }
  .toggle.on { background:var(--track-on); }
  .toggle::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--knob); transition:transform 0.2s; }
  .toggle.on::after { transform:translateX(16px); }
</style>
</head>
<body>
  <h1>Dark Inverter Settings</h1>
  <h2>Saved Sites</h2>
  <div id="siteList"></div>
  <button id="clearAll" class="clear-all" style="display:none">Clear All Sites</button>
  <h2>Element Overrides</h2>
  <div id="overrideList"></div>
  <script src="options.js"></script>
</body>
</html>
